name: Build & Package

# 触发：
#   - push 到 main：自动编译并发布 Release（自动 tag：ci-<时间>-<sha7>，默认预发布）
#   - workflow_dispatch（手动「Run workflow」）：也可手动一键发版（tag 可自定义，正式/预发布可选）
#   - push v* 标签：仅做构建验证（tag 仅作「定期备份」用途，不触发发版）
#   - 对 main 的 PR：仅构建验证
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 使用的 tag 名（留空则自动用 build-<时间>）。注意：此 tag 与「备份用 v* tag」相互独立'
        required: false
        default: ''
      prerelease:
        description: '是否标记为预发布'
        type: boolean
        required: false
        default: true

permissions:
  contents: write   # 发布 Release 需要

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_cli: patcher-linux-x64
          - os: windows-latest
            asset_cli: patcher-windows-x64
            asset_gui: patcher-gui-windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      # zlib 源码已内置在 third_party/zlib，由 CMake add_subdirectory 构建，
      # 无需 vcpkg / 系统 zlib / 网络连接。
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build
          zip -r ../${{ matrix.asset_cli }}.zip patcher
          cd ..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd build/Release
          # CLI 产物（agent.dll 仅在装有 Python 开发包时生成，故可选）
          $cli = 'patcher.exe'
          if (Test-Path agent.dll) { $cli += ';agent.dll' }
          7z a ../../${{ matrix.asset_cli }}.zip $cli.Split(';')
          # GUI 产物
          7z a ../../${{ matrix.asset_gui }}.zip patcher_gui.exe
          cd ../..

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_cli }}
          path: ${{ matrix.asset_cli }}.zip
          if-no-files-found: error

      - name: Upload GUI artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_gui }}
          path: ${{ matrix.asset_gui }}.zip
          if-no-files-found: error

  release:
    name: Release (自动 / 手动编译发布)
    needs: [ build ]
    # push 到 main 时自动发版；手动 workflow_dispatch 也可发版；PR / v* tag 只构建验证，不自动发版
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: 计算 Release tag / 预发布
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.release_tag }}" ]; then
              TAG="${{ github.event.inputs.release_tag }}"
            else
              TAG="build-$(date +%Y%m%d-%H%M%S)"
            fi
            PRERE="${{ github.event.inputs.prerelease }}"
          else
            # push main 自动发版：自动 tag，默认预发布（自动构建产物）
            TAG="ci-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
            PRERE="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERE" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checkout (读取 CHANGELOG 作为发布说明)
        uses: actions/checkout@v4

      - name: 提取本版更新说明（不指向提交记录，取自 CHANGELOG 首个版本块）
        id: notes
        shell: bash
        run: |
          awk '/^## v/{c++} c==1{print} c==2{exit}' CHANGELOG.md > release_notes.md
          echo "提取行数: $(wc -l < release_notes.md)"

      - name: List artifacts
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: artifacts/**/*.zip
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: release_notes.md
