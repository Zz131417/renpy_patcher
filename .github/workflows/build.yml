name: Build & Release

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'doc/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Linux：CLI（make）+ 单元测试 ----------
  linux-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }
      - name: Install zlib
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build
        run: make
      - name: Test (rpz 往返 + 解包/重打包 + 注入 + 重打包 APK)
        run: make test
      - name: Smoke
        run: ./build/bin/patcher --help || true
      - name: Package CLI
        run: |
          mkdir -p cli_linux && cp build/bin/patcher cli_linux/ && cp build/bin/sfx_stub cli_linux/ 2>/dev/null || true
          zip -r patcher_cli_linux64.zip cli_linux
      - uses: actions/upload-artifact@v4
        with: { name: cli-linux64, path: patcher_cli_linux64.zip }

  # ---------- Windows：CLI + 核心 DLL + WPF(GUI) ----------
  windows-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        shell: cmd
        run: |
          git clone https://github.com/microsoft/vcpkg D:\a\vcpkg
          D:\a\vcpkg\bootstrap-vcpkg.bat

      - name: Configure (x64)
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=D:/a/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static -DRP_BUILD_NUM=${{ github.run_number }}

      - name: Build core DLL + CLI
        run: cmake --build build --config Release --target patcher patcher_core

      - name: Publish WPF GUI (self-contained)
        run: dotnet publish gui_wpf/gui_wpf.csproj -c Release -r win-x64 --self-contained true -o gui_publish

      - name: Bundle native DLL + CLI
        shell: cmd
        run: |
          copy build\bin\Release\patcher_core.dll gui_publish\
          copy build\bin\Release\patcher.exe gui_publish\
          copy build\bin\Release\sfx_stub.exe gui_publish\

      - name: Zip GUI
        shell: cmd
        run: powershell Compress-Archive -Path gui_publish\* -DestinationPath patcher_gui_win64.zip -Force

      - name: Zip CLI (Windows)
        shell: cmd
        run: |
          mkdir cli_win64
          copy build\bin\Release\patcher.exe cli_win64\
          copy build\bin\Release\sfx_stub.exe cli_win64\
          powershell Compress-Archive -Path cli_win64\* -DestinationPath patcher_cli_win64.zip -Force

      - name: Generate version.json
        shell: bash
        run: |
          VER=$(cat VERSION)
          BUILD=${{ github.run_number }}
          echo "{ \"version\": \"$VER\", \"build\": \"$BUILD\", \"commit\": \"${{ github.sha }}\", \"tag\": \"v${VER}-beta$(printf '%s' \"$BUILD\" | tail -c 1)\" }" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with: { name: gui-win64, path: patcher_gui_win64.zip }
      - uses: actions/upload-artifact@v4
        with: { name: cli-win64, path: patcher_cli_win64.zip }
      - uses: actions/upload-artifact@v4
        with: { name: version-json, path: version.json }

      - name: Draft Release
        shell: bash
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          VER=$(cat VERSION); BUILD=${{ github.run_number }}
          TAG="v${VER}-beta${BUILD}"
          gh release create "$TAG" --draft --title "$TAG (测试版)" \
            --notes "Ren'Py Patcher 测试版（含 GUI）。GUI 基于 WPF，通过 patcher_core.dll 调用核心库；CLI 二进制 patcher.exe 仍可用。解包/重打包/注入/来源声明/导出zip/导出APK/分支导图/翻译流水线。" \
            patcher_gui_win64.zip patcher_cli_win64.zip version.json
