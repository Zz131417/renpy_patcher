name: Build & Package

# 触发：
#   - push 到 main / v* 标签：仅做构建验证（CI）
#   - 对 main 的 PR：构建验证
#   - workflow_dispatch（手动「Run workflow」）：直接编译并发布 Release
#     注：tag 仅作为「定期备份」用途（push v* 标签会跑构建验证，但不会自动发版）；
#          发版统一走手动一键，不再依赖 tag。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 使用的 tag 名（留空则自动用 build-<时间>）。注意：此 tag 与「备份用 v* tag」相互独立'
        required: false
        default: ''
      prerelease:
        description: '是否标记为预发布'
        type: boolean
        required: false
        default: true

permissions:
  contents: write   # 发布 Release 需要

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_cli: patcher-linux-x64
          - os: windows-latest
            asset_cli: patcher-windows-x64
            asset_gui: patcher-gui-windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      # zlib 源码已内置在 third_party/zlib，由 CMake add_subdirectory 构建，
      # 无需 vcpkg / 系统 zlib / 网络连接。
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build
          zip -r ../${{ matrix.asset_cli }}.zip patcher
          cd ..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd build/Release
          # CLI 产物（agent.dll 仅在装有 Python 开发包时生成，故可选）
          $cli = 'patcher.exe'
          if (Test-Path agent.dll) { $cli += ';agent.dll' }
          7z a ../../${{ matrix.asset_cli }}.zip $cli.Split(';')
          # GUI 产物
          7z a ../../${{ matrix.asset_gui }}.zip patcher_gui.exe
          cd ../..

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_cli }}
          path: ${{ matrix.asset_cli }}.zip
          if-no-files-found: error

      - name: Upload GUI artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_gui }}
          path: ${{ matrix.asset_gui }}.zip
          if-no-files-found: error

  release:
    name: Release (手动一键编译发布)
    needs: [ build ]
    # 仅在手动 workflow_dispatch 时发版；push / PR 只做构建验证，不会自动发版
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 计算 Release tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: artifacts/**/*.zip
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
