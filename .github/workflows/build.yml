name: Build & Release

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'doc/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Linux：仅构建 CLI（cmake）+ 冒烟测试 ----------
  linux-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install zlib
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DRP_BUILD_NUM=${{ github.run_number }}
          cmake --build build --config Release --target patcher
      - name: Smoke
        run: ./build/patcher --help || true
      - name: Package CLI
        run: |
          mkdir -p cli_linux && cp build/patcher cli_linux/
          zip -r patcher_cli_linux64.zip cli_linux
      - uses: actions/upload-artifact@v4
        with: { name: cli-linux64, path: patcher_cli_linux64.zip }

  # ---------- Windows：核心 DLL + CLI + WPF(GUI) ----------
  windows-gui:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: microsoft/setup-msbuild@v2

      # zlib 源码内置在 third_party/zlib，由 CMake add_subdirectory 构建，无需 vcpkg / 系统 zlib。
      - name: Configure (x64)
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DRP_BUILD_NUM=${{ github.run_number }}

      - name: Build core DLL + CLI
        run: cmake --build build --config Release --target patcher patcher_core

      - name: Publish WPF GUI (self-contained)
        shell: bash
        working-directory: gui_wpf
        run: dotnet publish -c Release -r win-x64 --self-contained true -o ../gui_publish

      - name: Bundle native DLL + CLI
        shell: cmd
        run: |
          copy build\Release\patcher_core.dll gui_publish\
          copy build\Release\patcher.exe gui_publish\
          if exist build\Release\sfx_stub.exe copy build\Release\sfx_stub.exe gui_publish\

      - name: Zip GUI
        shell: cmd
        run: powershell Compress-Archive -Path gui_publish\* -DestinationPath patcher_gui_win64.zip -Force

      - name: Zip CLI (Windows)
        shell: cmd
        run: |
          mkdir cli_win64
          copy build\Release\patcher.exe cli_win64\
          if exist build\Release\sfx_stub.exe copy build\Release\sfx_stub.exe cli_win64\
          powershell Compress-Archive -Path cli_win64\* -DestinationPath patcher_cli_win64.zip -Force

      - uses: actions/upload-artifact@v4
        with: { name: gui-win64, path: patcher_gui_win64.zip }
      - uses: actions/upload-artifact@v4
        with: { name: cli-win64, path: patcher_cli_win64.zip }

  # ---------- 汇总发布（等两个构建 job 都成功后再发） ----------
  release:
    needs: [linux-cli, windows-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: ., merge-multiple: true }
      - name: Draft Release & Update latest/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          export VER=$(cat VERSION | tr -d '[:space:]')
          export BUILD="${{ github.run_number }}"
          export DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # 正式发布判定：仓库根存在 .release_stable 则为正式版（v主版本，非预发布）
          if [ -f .release_stable ]; then
            export TAG="v${VER}"
            export PRERELEASE_FLAG=""
            export REL_TITLE="${TAG} (正式版)"
            export IS_PRERELEASE=false
          else
            # 下一个 beta 字母：查 git tags 中当前主版本最大的 beta 字母 +1；无则 A。
            # （发正式版若 bump 主版本号，新版本下没有 betaX，自然从 A 重算。）
            python3 - <<'PY' > /tmp/next_tag.txt
            import os, json, re, urllib.request
            TOKEN = os.environ["GITHUB_TOKEN"]; REPO = os.environ["GITHUB_REPOSITORY"]; VER = os.environ["VER"]
            H = {"Authorization": f"Bearer {TOKEN}", "Accept": "application/vnd.github+json"}
            tags = json.load(urllib.request.urlopen(
                urllib.request.Request(f"https://api.github.com/repos/{REPO}/tags?per_page=200", headers=H), timeout=30))
            letters = [m.group(1) for t in tags
                       if (m := re.match(rf"^v{re.escape(VER)}-beta([A-Za-z]+)$", t["name"]))]
            nxt = "A" if not letters else chr(ord(sorted(letters)[-1]) + 1)
            print(f"v{VER}-beta{nxt}")
            PY
            export TAG=$(cat /tmp/next_tag.txt)
            export PRERELEASE_FLAG="--prerelease"
            export REL_TITLE="${TAG} (预发布)"
            export IS_PRERELEASE=true
          fi
          export URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          echo "发布标签: $TAG  (prerelease=$IS_PRERELEASE)"
          # 生成 version.json（与 latest 分支既有格式一致）
          python3 - <<'PY'
          import os,json
          body={"tag":os.environ["TAG"],"version":os.environ["VER"],"build":int(os.environ["BUILD"]),
                "prerelease":(os.environ["IS_PRERELEASE"]=="true"),"date":os.environ["DATE"],"url":os.environ["URL"]}
          open("version.json","w").write(json.dumps(body,ensure_ascii=False,indent=2)+"\n")
          print("version.json:\n"+open("version.json").read())
          PY
          ls -la
          NOTES="Ren'Py Patcher"
          if [ "$IS_PRERELEASE" = true ]; then NOTES="$NOTES 预发布版"; else NOTES="$NOTES 正式版"; fi
          NOTES="$NOTES（含 GUI）。GUI 基于 WPF，通过 patcher_core.dll 调用核心库；CLI 二进制 patcher / patcher.exe 仍可用。解包/重打包/注入/来源声明/导出zip/导出APK/分支导图/翻译流水线。"
          gh release create "$TAG" $PRERELEASE_FLAG --title "$REL_TITLE" \
            --notes "$NOTES" \
            patcher_gui_win64.zip patcher_cli_win64.zip patcher_cli_linux64.zip version.json
          # 更新 latest 分支的 version.json（供 GUI 检查更新）
          python3 - <<'PY'
          import os,json,base64,urllib.request
          TOKEN=os.environ["GITHUB_TOKEN"]; REPO=os.environ["GITHUB_REPOSITORY"]
          content=base64.b64encode(open("version.json","rb").read()).decode()
          req=urllib.request.Request(f"https://api.github.com/repos/{REPO}/contents/version.json?ref=latest",
              headers={"Authorization":f"Bearer {TOKEN}"})
          try: sha=json.load(urllib.request.urlopen(req))["sha"]
          except Exception: sha=None
          data={"message":f"update version.json ({os.environ['TAG']})","content":content,"branch":"latest"}
          if sha: data["sha"]=sha
          r=urllib.request.Request(f"https://api.github.com/repos/{REPO}/contents/version.json",
              data=json.dumps(data).encode(),
              headers={"Authorization":f"Bearer {TOKEN}","Content-Type":"application/json"},method="PUT")
          print("latest/version.json:", urllib.request.urlopen(r).read().decode()[:120])
          PY
