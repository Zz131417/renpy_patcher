name: Build & Package

# 触发：推送到 main、打 v* 标签、对 main 的 PR
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write   # 发布 Release 需要

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_cli: patcher-linux-x64
          - os: windows-latest
            asset_cli: patcher-windows-x64
            asset_gui: patcher-gui-windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      # zlib 源码已内置在 third_party/zlib，由 CMake add_subdirectory 构建，
      # 无需 vcpkg / 系统 zlib / 网络连接。
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build
          zip -r ../${{ matrix.asset_cli }}.zip patcher
          cd ..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd build/Release
          # CLI 产物（agent.dll 仅在装有 Python 开发包时生成，故可选）
          $cli = 'patcher.exe'
          if (Test-Path agent.dll) { $cli += ';agent.dll' }
          7z a ../../${{ matrix.asset_cli }}.zip $cli.Split(';')
          # GUI 产物
          7z a ../../${{ matrix.asset_gui }}.zip patcher_gui.exe
          cd ../..

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_cli }}
          path: ${{ matrix.asset_cli }}.zip
          if-no-files-found: error

      - name: Upload GUI artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_gui }}
          path: ${{ matrix.asset_gui }}.zip
          if-no-files-found: error

  release:
    name: Release on tag
    needs: [ build ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          draft: false
          prerelease: true        # 当前为测试版，默认标记为预发布
          generate_release_notes: true
