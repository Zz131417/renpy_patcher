name: Build & Package

# 触发：
#   - push 到 main：自动编译并发布 Release（自动 tag：ci-<时间>-<sha7>，默认预发布）
#   - workflow_dispatch（手动「Run workflow」）：也可手动一键发版（tag 可自定义，正式/预发布可选）
#   - push v* 标签：仅做构建验证（tag 仅作「定期备份」用途，不触发发版）
#   - 对 main 的 PR：仅构建验证
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 使用的 tag 名（留空则自动用 build-<时间>）。注意：此 tag 与「备份用 v* tag」相互独立'
        required: false
        default: ''
      prerelease:
        description: '是否标记为预发布'
        type: boolean
        required: false
        default: true

permissions:
  contents: write   # 发布 Release 需要

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_cli: patcher-linux-x64
          - os: windows-latest
            asset_cli: patcher-windows-x64
            asset_gui: patcher-gui-windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      # zlib 源码已内置在 third_party/zlib，由 CMake add_subdirectory 构建，
      # 无需 vcpkg / 系统 zlib / 网络连接。
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build
          zip -r ../${{ matrix.asset_cli }}.zip patcher
          cd ..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd build/Release
          # CLI 产物（agent.dll 仅在装有 Python 开发包时生成，故可选）
          $cli = 'patcher.exe'
          if (Test-Path agent.dll) { $cli += ';agent.dll' }
          7z a ../../${{ matrix.asset_cli }}.zip $cli.Split(';')
          # GUI 产物
          7z a ../../${{ matrix.asset_gui }}.zip patcher_gui.exe
          cd ../..

      # ---- 生成 MSI 安装包（仅 Windows GUI） ----
      - name: 准备安装目录（复制 exe + VC++ 运行库）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $deploy = "installer_deploy"
          New-Item -ItemType Directory -Force $deploy | Out-Null
          Copy-Item build/Release/patcher_gui.exe $deploy/
          if (Test-Path build/Release/agent.dll) { Copy-Item build/Release/agent.dll $deploy/ }
          # 复制 C++/CLI 运行所依赖的 VC++ 运行库，使目标机无需额外安装 VC++ 可再发行组件。
          # 优先从 VS 2022 Redist 目录找，找不到则从 System32 拷对应的 DLL（CI 机器自带）。
          $dlls = @('vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','concrt140.dll')
          $vcroot = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022" -Recurse -Directory -Filter "Microsoft.VC143.CRT" -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1
          $copied = 0
          if ($vcroot) {
            foreach ($d in $dlls) {
              $src = Join-Path $vcroot.FullName $d
              if (Test-Path $src) { Copy-Item $src $deploy\; $copied++ }
            }
          } else {
            $sys = Join-Path $env:SystemRoot "System32"
            foreach ($d in $dlls) {
              $src = Join-Path $sys $d
              if (Test-Path $src) { Copy-Item $src $deploy\; $copied++ }
            }
          }
          Write-Host "已复制 VC++ 运行库 $copied 个"
          Get-ChildItem $deploy

      - name: 安装 WiX Toolset
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress -y

      - name: 生成 MSI 安装包
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 版本号：优先读仓库根 VERSION，兜底用 git 描述
          $root = (Get-Location).Path
          $verFile = Join-Path $root "VERSION"
          if (Test-Path $verFile) { $ver = (Get-Content $verFile -Raw).Trim() } else { $ver = $null }
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = (git describe --tags --always).Trim() }
          # 规范成 x.y.z（去掉可能的 v 前缀）
          $ver = $ver.TrimStart('v')
          if ($ver -notmatch '^\d+\.\d+\.\d') { $ver = "1.0.0" }
          Write-Host "打包版本号: $ver"
          Push-Location gui/installer
          $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset*" | Select-Object -First 1
          if (-not $wix) { $wix = Get-ChildItem "C:\Program Files" -Directory -Filter "WiX Toolset*" | Select-Object -First 1 }
          $env:PATH += ";$($wix.FullName)\bin"
          New-Item -ItemType Directory -Force obj | Out-Null
          heat dir ../../installer_deploy -gg -sfrag -sreg -scom -suid -srd -cg DeployFiles -dr INSTALLFOLDER -var var.DeploySource -arch x64 -out files.wxs
          candle -arch x64 "-dVersion=$ver" "-dDeploySource=../../installer_deploy" -ext WixUIExtension product.wxs files.wxs -o obj/
          light -ext WixUIExtension obj/product.wixobj obj/files.wixobj -o ../../patcher-gui-windows-x64.msi
          if ($LASTEXITCODE -ne 0) { throw "light failed, exit code $LASTEXITCODE" }
          Pop-Location
          Get-ChildItem patcher-gui-windows-x64.msi

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_cli }}
          path: ${{ matrix.asset_cli }}.zip
          if-no-files-found: error

      - name: Upload GUI artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_gui }}
          path: ${{ matrix.asset_gui }}.zip
          if-no-files-found: error
      - name: Upload MSI artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: patcher-gui-windows-x64-msi
          path: patcher-gui-windows-x64.msi
          if-no-files-found: error

  release:
    name: Release (自动 / 手动编译发布)
    needs: [ build ]
    # push 到 main 时自动发版；手动 workflow_dispatch 也可发版；PR / v* tag 只构建验证，不自动发版
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: 计算 Release tag / 预发布
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.release_tag }}" ]; then
              TAG="${{ github.event.inputs.release_tag }}"
            else
              TAG="build-$(date +%Y%m%d-%H%M%S)"
            fi
            PRERE="${{ github.event.inputs.prerelease }}"
          else
            # push main 自动发版：自动 tag，默认预发布（自动构建产物）
            TAG="ci-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
            PRERE="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERE" >> "$GITHUB_OUTPUT"

      # 先 checkout 拿到 CHANGELOG（此时还没有 artifacts，clean 不会误删任何东西）
      - name: Checkout (读取 CHANGELOG 作为发布说明)
        uses: actions/checkout@v4

      # 再下载产物，确保 artifacts 在 checkout 之后写入、不会被清理
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 提取本版更新说明（不指向提交记录，取自 CHANGELOG 首个版本块）
        id: notes
        shell: bash
        run: |
          awk '/^## v/{c++} c==1{print} c==2{exit}' CHANGELOG.md > release_notes.md
          echo "提取行数: $(wc -l < release_notes.md)"

      - name: List artifacts
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: artifacts/**/*
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: release_notes.md
