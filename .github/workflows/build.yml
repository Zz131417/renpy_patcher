name: Build & Package

# 触发：推送到 main、打 v* 标签、对 main 的 PR
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write   # 发布 Release 需要

jobs:
  build:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: patcher-linux-x64
          - os: windows-latest
            asset: patcher-windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install zlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      # Windows 走 vcpkg：仓库根 vcpkg.json 声明 zlib 依赖，
      # 下面 Configure 用 vcpkg toolchain 时会在 manifest 模式自动拉取 zlib。
      - name: Configure (Windows / vcpkg manifest)
        if: runner.os == 'Windows'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build
          zip -r ../${{ matrix.asset }}.zip patcher
          cd ..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd build/Release
          7z a ../../${{ matrix.asset }}.zip patcher.exe agent.dll
          cd ../..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          if-no-files-found: error

  build-gui:
    name: Build GUI (Windows .NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC + .NET
        uses: microsoft/setup-msbuild@v2

      - name: Install zlib via vcpkg (manifest)
        run: |
          vcpkg integrate install
          vcpkg install zlib:x64-windows

      - name: Generate core/version.h
        run: cmake -D VERSION_FILE=VERSION -P cmake/generate_version.cmake

      - name: Build GUI (patcher_gui)
        run: msbuild gui/patcher_gui.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Package GUI
        run: |
          cd gui/x64/Release
          7z a ../../../../patcher-gui-windows-x64.zip patcher_gui.exe
          cd ../../..

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: patcher-gui-windows-x64
          path: patcher-gui-windows-x64.zip
          if-no-files-found: error

  release:
    name: Release on tag
    needs: [ build, build-gui ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          draft: false
          prerelease: true        # 当前为测试版，默认标记为预发布
          generate_release_notes: true
